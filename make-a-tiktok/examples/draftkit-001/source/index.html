<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DraftKit Showreel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@600;700&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="./src/showreel.css" />
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="world" width="1080" height="1920"></canvas>
      <div id="ui"></div>
      <canvas id="fx" width="1080" height="1920"></canvas>
      <div id="grade"></div>
    </div>
  </div>
  <div id="controls" hidden>
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="15" step="0.001" value="0" />
    <output id="clock">0.00s</output>
  </div>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
